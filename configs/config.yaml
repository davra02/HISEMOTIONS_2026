# HISEMOTIONS @ IberLEF 2026 — Hyperparameters
# Main model: RoBERTa BNE (mejor generalización en español)
# Alternativa: dccuchile/bert-base-spanish-wwm-cased (BETO)

model_name: "PlanTL-GOB-ES/roberta-base-bne"

# Data
train_path: "train/train.csv"
dev_path: "dev/dev.csv"
test_path: "test/test.csv"

# Training
max_length: 256
batch_size: 16
num_epochs: 5
learning_rate: 2.0e-5
dropout: 0.3
warmup_ratio: 0.1
weight_decay: 0.01
num_workers: 0       # 0 = sin multiprocessing (compatible con M4 y Colab)

# Output
output_dir: "models/"
submissions_dir: "submissions/"
